[package]
name = "nuxt-beats"
version = "0.0.1"
description = "Desktop music player made with Nuxt and Tauri"
authors = [
  "valentimarco",
  "zAlweNy26"
]
license = "MIT"
repository = "https://github.com/valentimarco/NuxtBeats"
edition = "2021"

[lib]
name = "nuxt_beats_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.4.0"
features = [ ]

[dependencies]
tauri-plugin-notification = "2.3.1"
tauri-plugin-fs = "2.4.2"
tauri-plugin-store = "2.4.0"
serde_json = "1.0.143"
tauri-plugin-shell = "2.3.0"
time = "0.3.41"

[dependencies.tauri]
version = "2.8.2"
features = [
  "tray-icon",
  "unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.3.3"
